[project]
name = "ai-business-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "neon-api>=0.3.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
]

[tool.uv.workspace]
members = [
    "packages/common_config",
    "packages/common_exceptions",
    "packages/common_logging",
    "packages/common_utility",
    "services/*"
]

[tool.uv.sources]
common-config = { workspace = true }
common-exceptions = { workspace = true }
